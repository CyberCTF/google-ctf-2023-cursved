# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Cursved (Google's 2023 security competition, by Google; a crypto challenge) as an Isoloom spec:
# a signature scheme over a Pell conic: the server gives its public key and a nonce and asks for a signature.
# The challenge folder 2023/quals/crypto-cursved of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2023-cursved

networks:
  lab: { cidr: 10.60.185.0/24, internet: false }

machines:
  challenge:
    networks: { lab: 10 }
    services: [{ port: 1337, name: challenge, publish: 1337 }]
    resources: { cpus: 1, memory_mb: 512 }
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    docker:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the server sends its public key and a nonce
    script: checks/probe.sh
    wait: 60

message: |
  Cursved (Google, 2023) answers at `nc localhost {{ machines.challenge.services.0.publish }}`.
  Is the curve really an elliptic curve? Look at the group it defines.
